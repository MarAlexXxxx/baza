<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#15202A">
<title>База знаний оператора</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Layout: одна колонка до 680px; экран входа → главная (поиск, разделы) → раздел во весь экран поверх */
:root {
  color-scheme: light;
  --bg: #EEF2F4; --surface: #FFFFFF; --sunk: #E3E9EC; --ink: #15202A; --muted: #5A6874; --line: #D3DBE0;
  --accent: #C3161C; --accent-ink: #FFFFFF; --steel: #2D5873; --steel-soft: #DCE8F0; --ok: #1D7347; --bad: #B3261E; --warn-soft: #FBEFD5;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E1418; --surface: #162028; --sunk: #1D2932; --ink: #E4EBEF; --muted: #93A3AE; --line: #2A3842; --accent: #FF5C57; --accent-ink: #1A0606; --steel: #84B6D8; --steel-soft: #1E3342; --ok: #52C98F; --bad: #FF7A72; --warn-soft: #362A12; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0E1418; --surface: #162028; --sunk: #1D2932; --ink: #E4EBEF; --muted: #93A3AE; --line: #2A3842; --accent: #FF5C57; --accent-ink: #1A0606; --steel: #84B6D8; --steel-soft: #1E3342; --ok: #52C98F; --bad: #FF7A72; --warn-soft: #362A12; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: var(--f-display); font-size: 30px; line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-size: 20px; line-height: 1.15; margin: 0; }
p { margin: 0; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); } .small { font-size: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 16px; font-weight: 600; cursor: pointer; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.slim { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--steel); outline-offset: 2px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
input[type="text"], input[type="password"], input[type="search"] { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 48px; font-size: 16px; }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.check input { width: 20px; height: 20px; }
.err { color: var(--bad); font-size: 14px; min-height: 20px; }
.lock { width: 56px; height: 56px; border-radius: 14px; background: var(--steel-soft); display: grid; place-items: center; }
.lock svg { width: 30px; height: 30px; fill: none; stroke: var(--steel); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* hub */
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card { appearance: none; text-align: left; display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: start; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; width: 100%; }
.card > div { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.card.soon { opacity: .6; border-style: dashed; cursor: default; }
.ic { width: 48px; height: 48px; border-radius: 10px; background: var(--steel-soft); display: grid; place-items: center; }
.ic svg { width: 28px; height: 28px; fill: none; stroke: var(--steel); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tag { font-family: var(--f-mono); font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.prog { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
/* search */
.res { display: flex; flex-direction: column; gap: 10px; }
.hit { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.hit .k { font-family: var(--f-mono); font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.hit .t { font-weight: 700; font-family: var(--f-display); font-size: 17px; }
.hit .src { font-size: 13px; color: var(--steel); }
.hit.term { border-left: 4px solid var(--accent); }
mark { background: var(--warn-soft); color: inherit; border-radius: 2px; }
/* glossary */
.letters { display: flex; flex-wrap: wrap; gap: 4px; }
.letters button { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; min-width: 34px; min-height: 34px; cursor: pointer; font-family: var(--f-mono); font-weight: 700; }
/* frame */
#frameWrap { position: fixed; inset: 0; background: var(--bg); z-index: 10; }
#frame { width: 100%; height: 100%; border: 0; display: block; }
.center { min-height: 100%; display: flex; flex-direction: column; justify-content: center; }
</style>
</head>
<body>
<div id="vLoad" class="wrap center"><p class="muted">Загрузка…</p></div>

<div id="vLogin" class="wrap center" hidden>
  <form id="fLogin" class="panel" autocomplete="on" novalidate>
    <span class="lock"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
    <h1>База знаний оператора</h1>
    <p class="small muted">Вход по логину и паролю, которые тебе выдали. Без них материалы не открываются.</p>
    <label class="f" for="iLogin">Логин<input type="text" id="iLogin" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="f" for="iPass">Пароль<input type="password" id="iPass" name="password" autocomplete="current-password" required></label>
    <label class="check" for="iRem"><input type="checkbox" id="iRem" checked> Запомнить на этом телефоне (работает без интернета)</label>
    <p class="err" id="eLogin" role="alert"></p>
    <button class="btn primary" id="bLogin" type="submit">Войти</button>
  </form>
</div>

<div id="vHub" class="wrap" hidden></div>
<div id="frameWrap" hidden><iframe id="frame" title="Раздел" allow="clipboard-write"></iframe></div>

<script>
"use strict";
const ITER = 310000;
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
let DATA = null, KEYINFO = null, ME = "";

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  try { navigator.serviceWorker.register("sw.js"); } catch (e) {}
}

/* ---------- storage of remembered key (IndexedDB, non-extractable CryptoKey) ---------- */
function idb() { return new Promise((res, rej) => { const r = indexedDB.open("baza", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function kvGet(k) { try { const db = await idb(); return await new Promise((res) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch (e) { return undefined; } }
async function kvSet(k, v) { try { const db = await idb(); await new Promise((res) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }
async function kvDel(k) { try { const db = await idb(); await new Promise((res) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").delete(k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }

/* ---------- crypto ---------- */
async function loadKeys() { const r = await fetch("keys.json", { cache: "no-cache" }); if (!r.ok) throw new Error("keys"); return r.json(); }
async function loadData(key, onp) {
  const r = await fetch("data.enc", { cache: "no-cache" }); if (!r.ok) throw new Error("data");
  let buf;
  const total = +r.headers.get("content-length") || 0;
  if (onp && r.body && r.body.getReader) {
    const rd = r.body.getReader(), parts = []; let got = 0;
    for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; onp(got, total); }
    buf = new Uint8Array(got); let o = 0; for (const x of parts) { buf.set(x, o); o += x.length; }
  } else buf = new Uint8Array(await r.arrayBuffer());
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
  return JSON.parse(dec.decode(plain));
}
async function userId(login) { return hex(await crypto.subtle.digest("SHA-256", enc.encode("baza-v1|" + login.trim().toLowerCase()))); }
async function unlock(login, pass) {
  const keys = KEYINFO || (KEYINFO = await loadKeys());
  const u = keys.users[await userId(login)];
  // одинаковая работа и для несуществующего логина, чтобы по времени нельзя было понять, есть ли он
  const salt = u ? b64(u.s) : crypto.getRandomValues(new Uint8Array(16));
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const kek = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: keys.it || ITER }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  if (!u) throw new Error("bad");
  let inner;
  try { inner = JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(u.i) }, kek, b64(u.w)))); } catch (e) { throw new Error("bad"); }
  const key = await crypto.subtle.importKey("raw", b64(inner.k), { name: "AES-GCM" }, false, ["decrypt"]);
  return { key, name: inner.n, kv: keys.kv };
}

/* ---------- boot ---------- */
async function boot() {
  const saved = await kvGet("sess");
  if (saved && saved.key) {
    try { DATA = await loadData(saved.key); ME = saved.name; return showHub(); }
    catch (e) { await kvDel("sess"); }
  }
  showLogin();
}
function showLogin(msg) {
  ["#vLoad", "#vHub", "#frameWrap"].forEach(s => $(s).hidden = true); $("#vLogin").hidden = false;
  $("#eLogin").textContent = msg || "";
}
$("#fLogin").addEventListener("submit", async e => {
  e.preventDefault();
  const l = $("#iLogin").value, p = $("#iPass").value;
  if (!l.trim() || !p) { $("#eLogin").textContent = "Введи логин и пароль."; return; }
  $("#bLogin").disabled = true; $("#bLogin").textContent = "Проверяю…"; $("#eLogin").textContent = "";
  try {
    const s = await unlock(l, p);
    $("#bLogin").textContent = "Загружаю базу…";
    DATA = await loadData(s.key, (got, total) => { $("#bLogin").textContent = "Загружаю базу: " + (total ? Math.min(99, Math.round(got / total * 100)) + "%" : (got / 1048576).toFixed(1) + " МБ"); }); ME = s.name;
    if ($("#iRem").checked) await kvSet("sess", { key: s.key, name: s.name, kv: s.kv }); else await kvDel("sess");
    $("#iPass").value = "";
    showHub();
  } catch (err) {
    $("#eLogin").textContent = err.message === "bad" ? "Неверный логин или пароль." : "Не удалось загрузить данные. Проверь интернет и попробуй ещё раз.";
  } finally { $("#bLogin").disabled = false; $("#bLogin").textContent = "Войти"; }
});

/* ---------- hub ---------- */
const IC = {
  fontanka: '<path d="M12 2v20"/><path d="M4 9h16"/><circle cx="12" cy="9" r="2.4"/><circle cx="6.5" cy="9" r="1.8"/><circle cx="17.5" cy="9" r="1.8"/><circle cx="12" cy="15" r="2.4"/>',
  ot: '<path d="M12 3l9 16H3z"/><path d="M12 10v4"/><path d="M12 17h.01"/>',
  sosudy: '<circle cx="12" cy="13" r="7"/><path d="M12 13l4-3"/><path d="M12 3v3"/>',
  strop: '<path d="M12 3v6"/><path d="M6 9h12l-2 6H8z"/><path d="M9 15l-3 6M15 15l3 6"/>',
  gnvp: '<path d="M12 21V9"/><path d="M8 5c0 2 4 2 4 4s4 2 4 0"/><path d="M6 21h12"/>',
  gsu: '<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="9" cy="9" r="2.2"/><circle cx="15" cy="9" r="2.2"/><path d="M8 15h8M8 18h5"/>',
  bos: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M7 6V4h10v2"/><path d="M8 12h8"/>',
  mos: '<path d="M3 17h18"/><path d="M6 17V9h12v8"/><path d="M9 9V6h6v3"/><circle cx="12" cy="13" r="1.8"/>',
  sprav: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 8h6M9 12h4"/>'
};
function progress(s) {
  if (!s.key || !s.total) return null;
  let m = 0;
  try { const st = JSON.parse(localStorage.getItem(s.key) || "{}"); Object.values(st.q || {}).forEach(r => { if ((r.s || 0) >= 2) m++; }); } catch (e) {}
  return m;
}
let hubMode = "home", query = "", letter = "";
function showHub() {
  ["#vLoad", "#vLogin", "#frameWrap"].forEach(s => $(s).hidden = true); $("#vHub").hidden = false;
  renderHub();
}
function renderHub() {
  const h = $("#vHub");
  if (hubMode === "sprav") return renderSprav();
  h.innerHTML = `
    <div class="top"><span class="eyebrow">${esc(ME ? "Доступ: " + ME : "")}</span><button class="btn ghost slim" id="bOut">Выйти</button></div>
    <header style="display:flex;flex-direction:column;gap:8px"><h1>База знаний оператора</h1>
      <p class="muted">Материал для подготовки к ежегодной проверке знаний: читай, ищи ответы, проходи тесты.</p></header>
    <input type="search" id="iQ" placeholder="Поиск по всей базе: ОПО, наряд-допуск, УДК…" value="${esc(query)}" aria-label="Поиск по базе">
    <div id="hubBody"></div>
    <p class="small muted">Обновлено: ${esc(DATA.built || "")}<br>Прогресс тестов хранится только на этом устройстве.</p>`;
  $("#bOut").onclick = async () => { await kvDel("sess"); DATA = null; ME = ""; query = ""; showLogin(); };
  $("#iQ").oninput = e => { query = e.target.value; renderHubBody(); };
  renderHubBody();
}
function renderHubBody() {
  const b = $("#hubBody");
  if (query.trim().length >= 2) return renderSearch(b);
  b.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">${DATA.sections.map(s => {
    const m = progress(s);
    const inner = `<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[s.ic] || ""}</svg></span>
      <div><h2>${esc(s.title)}</h2><p class="small muted">${esc(s.text)}</p>
      ${s.html || s.id === "sprav" ? (m != null ? `<div class="prog"><span>освоено вопросов</span><span>${m} / ${s.total}</span></div><div class="bar"><i style="width:${Math.round(m / s.total * 100)}%"></i></div>` : "") : `<span class="tag">В РАЗРАБОТКЕ</span>`}</div>`;
    return (s.html || s.id === "sprav") ? `<button class="card" data-open="${s.id}">${inner}</button>` : `<div class="card soon">${inner}</div>`;
  }).join("")}</div>`;
  b.querySelectorAll("[data-open]").forEach(x => x.onclick = () => openSection(x.dataset.open));
}
const norm = s => String(s).toLowerCase().replace(/ё/g, "е").replace(/([а-яa-z])[\s-]+(\d)/g, "$1$2");
const STOPW = new Set("хочу хотим надо нужно как что где делать сделать мне нам можно ли если на в во по с со и или для при это то а но же бы".split(" "));
const normQ = s => String(s).toLowerCase().replace(/ё/g, "е").replace(/([а-яa-z])[\s-]+(\d)/g, "$1$2");
const qWords = q => normQ(q).split(/[^а-яa-z0-9.,]+/).filter(w => w.length > 1 && !STOPW.has(w)).map(w => w.length >= 6 ? w.slice(0, Math.max(4, w.length - 3)) : w);
function renderSearch(b) {
  const words = qWords(query);
  const hl = s => { let t = esc(s); words.forEach(w => { t = t.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>"); }); return t; };
  const scored = [];
  for (const it of DATA.index) {
    const hay = norm(it.t + " " + it.b + " " + (it.kw || ""));
    if (!words.every(w => hay.includes(w))) continue;
    let sc = it.k === "term" ? 100 : it.k === "safe" ? 60 : it.k === "text" ? 10 : 5;
    if (words.every(w => norm(it.t).includes(w))) sc += 50;
    scored.push([sc, it]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  const top = scored.slice(0, 40).map(x => x[1]);
  const K = { term: "Термин", text: "Материал", q: "Вопрос теста", safe: "Как сделать безопасно" };
  b.innerHTML = top.length ? `<p class="small muted">Найдено: ${scored.length}${scored.length > 40 ? " (показаны первые 40)" : ""}</p><div class="res">${top.map((it, i) => `
    <div class="hit ${it.k === "term" ? "term" : ""}">
      <span class="k">${K[it.k]} · ${esc(it.st)}</span>
      <span class="t">${hl(it.t)}</span>
      <span>${hl(it.b)}</span>
      ${it.src ? `<span class="src">Источник: ${esc(it.src)}</span>` : ""}
      ${it.s && it.s !== "sprav" ? `<button class="btn ghost slim" style="align-self:flex-start" data-go="${i}">Открыть в разделе</button>` : ""}
    </div>`).join("")}</div>` : `<div class="panel"><p>Ничего не нашлось.</p><p class="small muted">Попробуй короче или другим словом. Если термина нет — его нет и в загруженных документах; сообщи, и его добавят из нужного СТО.</p></div>`;
  b.querySelectorAll("[data-go]").forEach(x => x.onclick = () => { const it = top[+x.dataset.go]; openSection(it.s, it.ch, it.sf); });
}
function renderSprav() {
  const h = $("#vHub"), G = DATA.glossary;
  const letters = [...new Set(G.map(g => g.t[0].toUpperCase()))].sort((a, b) => a.localeCompare(b, "ru"));
  const list = G.filter(g => !letter || g.t[0].toUpperCase() === letter).sort((a, b) => a.t.localeCompare(b.t, "ru"));
  h.innerHTML = `
    <div class="top"><button class="btn ghost slim" id="bBack">← Все разделы</button><span class="eyebrow">${G.length} терминов</span></div>
    <h1>Справочник</h1>
    <p class="small muted">Определения дословно из законов, ФНП и СТО — с источником. Для поиска по всей базе вернись на главную.</p>
    <div class="letters"><button data-l="" ${!letter ? 'style="background:var(--ink);color:var(--bg)"' : ""}>Все</button>${letters.map(l => `<button data-l="${l}" ${letter === l ? 'style="background:var(--ink);color:var(--bg)"' : ""}>${l}</button>`).join("")}</div>
    <div class="res">${list.map(g => `<div class="hit term"><span class="t">${esc(g.t)}</span><span>${esc(g.d)}</span><span class="src">Источник: ${esc(g.src)}</span></div>`).join("")}</div>`;
  $("#bBack").onclick = () => { hubMode = "home"; renderHub(); };
  h.querySelectorAll("[data-l]").forEach(x => x.onclick = () => { letter = x.dataset.l; renderSprav(); });
  window.scrollTo(0, 0);
}

/* ---------- sections in iframe ---------- */
const BRIDGE = `<script>(function(){
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest('a[href="index.html"]');if(a){e.preventDefault();parent.postMessage({baza:"home"},"*");}},true);
window.addEventListener("message",function(e){var d=e.data||{};if(d.baza==="open"&&d.ch&&typeof viewChapter==="function"){try{viewChapter(d.ch);}catch(x){}}});
window.reportError=function(ctx){
 var old=document.getElementById("repBox");if(old)old.remove();
 var w=document.createElement("div");w.id="repBox";

function openSection(id, ch, sf) {
  if (id === "sprav") { hubMode = "sprav"; letter = ""; return renderHub(); }
  const s = DATA.sections.find(x => x.id === id); if (!s || !s.html) return;
  const f = $("#frame");
  f.onload = () => { if (sf) f.contentWindow.postMessage({ baza: "open", safe: sf }, "*"); else if (ch) f.contentWindow.postMessage({ baza: "open", ch }, "*"); };
  f.srcdoc = s.html.replace(/<body([^>]*)>/i, "<body$1>" + BRIDGE);
  $("#frameWrap").hidden = false; $("#vHub").hidden = true;
}
window.addEventListener("message", e => {
  if (e.source !== $("#frame").contentWindow) return;
  if ((e.data || {}).baza === "home") { $("#frameWrap").hidden = true; $("#frame").srcdoc = ""; $("#vHub").hidden = false; renderHub(); }
});
